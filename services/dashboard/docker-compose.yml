# Dashboard: "Patel Home Cloud" start page (Homepage, gethomepage.dev)
# Project folder on the NAS: /volume1/docker/dashboard
# UGOS Docker app project name: dashboard
# Public address: https://dashboard.example.com (Cloudflare Tunnel + Cloudflare Access login)
# At home: http://192.168.0.119:3010
#
# This file is the single source of truth for the dashboard. On every start the
# container first writes the Homepage config files (tiles, widgets, look and
# the animated nature background) from the text below, then starts Homepage.
# To change a tile: UGOS Docker app > Project > dashboard > Compose
# configuration, edit the YAML below, Redeploy. No secrets in this file.

services:
  dashboard:
    container_name: dashboard
    image: ghcr.io/gethomepage/homepage:v2.7.0
    restart: unless-stopped
    ports:
      - '3010:3000'
    environment:
      TZ: America/New_York
      HOMEPAGE_ALLOWED_HOSTS: dashboard.example.com,192.168.0.119:3010,<nas-name>.local:3010
    volumes:
      - /volume1/docker/dashboard/config:/app/config
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /app/config
        cat > /app/config/settings.yaml <<'PHC_EOF'
        title: Patel Home Cloud
        description: Everything on the HomeCloud NAS in one place
        theme: light
        color: stone
        headerStyle: clean
        statusStyle: dot
        target: _blank
        hideVersion: true
        disableUpdateCheck: true
        useEqualHeights: true
        layout:
          Photos:
            icon: mdi-image-multiple
          Communication:
            icon: mdi-chat
          Smart home:
            icon: mdi-home-automation
          Notes:
            icon: mdi-notebook
            style: row
            columns: 3
          Admin:
            icon: mdi-shield-lock
            style: row
            columns: 3
        PHC_EOF
        cat > /app/config/widgets.yaml <<'PHC_EOF'
        - greeting:
            text_size: xl
            text: Patel Home Cloud
        - datetime:
            text_size: md
            format:
              dateStyle: long
              timeStyle: short
              hour12: true
        - resources:
            label: NAS
            cpu: true
            memory: true
        - resources:
            label: Storage
            disk: /app/config
        PHC_EOF
        cat > /app/config/services.yaml <<'PHC_EOF'
        - Photos:
            - Immich:
                href: https://immich.example.com
                icon: immich.png
                description: Family photos and videos
                siteMonitor: http://192.168.0.119:2283
        - Communication:
            - Mattermost:
                href: https://mattermost.example.com
                icon: mattermost.png
                description: Family chat
                siteMonitor: http://192.168.0.119:8401
        - Smart home:
            - Home Assistant:
                href: https://ha.example.com
                icon: home-assistant.png
                description: Lights, cameras and automations
                siteMonitor: http://192.168.30.99:8123
        - Notes:
            - OKNote:
                href: https://oknote.example.com
                icon: mdi-notebook-edit-outline
                description: Quick notes
                siteMonitor: http://192.168.0.119:38080
            - SiYuan:
                href: https://siyuan.example.com
                icon: siyuan.png
                description: Knowledge base
                siteMonitor: http://192.168.0.119:6806
        - Admin:
            - NAS admin:
                href: https://mynas.example.com
                icon: mdi-nas
                description: UGOS storage, users and apps
                siteMonitor: http://192.168.0.119:9999
            - Portainer:
                href: https://portainer.example.com
                icon: portainer.png
                description: Docker containers
                siteMonitor: http://192.168.0.119:9000
            - Nginx Proxy Manager:
                href: http://192.168.0.119:81
                icon: nginx-proxy-manager.png
                description: Proxy admin, at home only
                siteMonitor: http://192.168.0.119:81
        PHC_EOF
        printf '[]\n' > /app/config/bookmarks.yaml
        printf '{}\n' > /app/config/docker.yaml
        cat > /app/config/custom.css <<'PHC_EOF'
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        /* Patel Home Cloud theme. One spacing step is 8px; radii are 12 (small) and 16 (cards, bars). */
        :root {
          --ink: #33304a; --ink-soft: #5d5873; --line: rgba(51, 48, 74, .12);
          --glass: rgba(255, 255, 255, .62); --glass-hover: rgba(255, 255, 255, .78); --glass-edge: rgba(255, 255, 255, .75);
          --shadow: 0 1px 2px rgba(40, 44, 80, .06), 0 8px 24px rgba(40, 44, 80, .12);
          --shadow-lift: 0 2px 4px rgba(40, 44, 80, .08), 0 16px 36px rgba(40, 44, 80, .18);
          --focus: #5b7fd6; --ok: #4cb07a; --down: #e06b6b;
        }
        html.phc-night {
          --ink: #f7f5ff; --ink-soft: #d6d1ea; --line: rgba(255, 255, 255, .16);
          --glass: rgba(34, 34, 66, .55); --glass-hover: rgba(44, 44, 80, .68); --glass-edge: rgba(255, 255, 255, .16);
          --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 8px 24px rgba(0, 0, 0, .28);
          --shadow-lift: 0 2px 4px rgba(0, 0, 0, .25), 0 16px 36px rgba(0, 0, 0, .35);
          --focus: #a9bfff;
        }
        html, body, #page_wrapper, #page_container, button, input { font-family: 'Nunito', ui-rounded, system-ui, sans-serif !important; }
        html, body, #page_wrapper, #page_container { background: transparent !important; }
        body { background-color: #dfeef5 !important; }
        #phc-scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        #phc-scene svg { display: block; width: 100%; height: 100%; }
        #page_wrapper { position: relative; z-index: 1; }
        #page_container { max-width: 1200px; margin: 0 auto; }

        /* ---------- Top bar: one glass bar, title left, chips right ---------- */
        #information-widgets {
          background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 16px;
          -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
          box-shadow: var(--shadow); margin: 16px 16px 8px !important; padding: 12px 16px !important;
        }
        #widgets-wrap { display: flex !important; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 !important; }
        #widgets-wrap > .widget-container { margin: 0 !important; padding: 0 !important; flex: 0 0 auto; }
        #information-widgets, #information-widgets * { color: var(--ink) !important; }
        .information-widget-greeting { margin-right: auto !important; }
        .information-widget-greeting span { font-size: 26px !important; line-height: 32px !important; font-weight: 800 !important; letter-spacing: .2px; }
        .information-widget-datetime span { font-size: 15px !important; line-height: 20px !important; font-weight: 700 !important; color: var(--ink-soft) !important; }

        /* Stat chips: CPU, memory and storage, all the same height and shape */
        .information-widget-resource {
          display: flex !important; align-items: center; gap: 8px; height: 44px; padding: 0 12px !important; margin: 0 !important;
          background: rgba(255, 255, 255, .45); border: 1px solid var(--line); border-radius: 12px; min-width: 112px;
        }
        html.phc-night .information-widget-resource { background: rgba(255, 255, 255, .08); }
        .information-widget-resource svg { width: 18px !important; height: 18px !important; flex: none; opacity: .85; }
        .information-widget-resource .flex-col { gap: 2px; padding: 0 !important; }
        .information-widget-resource .resource-value, .information-widget-resource .resource-value * { font-size: 13px !important; line-height: 16px !important; font-weight: 800 !important; }
        .information-widget-resource .resource-value + div, .information-widget-resource .resource-label { font-size: 11px !important; line-height: 14px !important; font-weight: 700 !important; color: var(--ink-soft) !important; text-transform: uppercase; letter-spacing: .5px; }
        .resource-usage { background: var(--line) !important; height: 4px !important; border-radius: 4px; width: 100% !important; margin-top: 2px; }
        .resource-usage > div { background: linear-gradient(90deg, #7fc7b4, #9d97e6) !important; height: 4px !important; border-radius: 4px; }
        /* The "NAS" and "Storage" captions repeat what the chips already say */
        #information-widgets .ml-6.pt-1.text-center.text-xs { display: none !important; }
        #information-widgets .widget-container > div:has(> .information-widget-resource) { display: flex; gap: 8px; margin: 0 !important; }

        /* Weather chip */
        #widgets-wrap > .phc-weather {
          display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 10px !important;
          background: rgba(255, 255, 255, .55); border: 1px solid var(--line); border-radius: 12px; order: 99;
        }
        html.phc-night #widgets-wrap > .phc-weather { background: rgba(255, 255, 255, .1); }
        .phc-weather svg { flex: none; }
        .phc-weather-text { display: flex; flex-direction: column; }
        .phc-weather-temp { font-size: 15px; line-height: 18px; font-weight: 800; }
        .phc-weather-label { font-size: 12px; line-height: 14px; font-weight: 700; color: var(--ink-soft) !important; }

        /* ---------- Groups ---------- */
        #services { padding: 0 10px !important; }
        .services-group { margin-bottom: 16px !important; padding: 0 6px !important; }
        .services-group > div:first-child, .services-group button { margin-bottom: 8px; }
        .services-group h2.service-group-name {
          color: var(--ink) !important; font-size: 13px !important; line-height: 16px !important; font-weight: 800 !important;
          text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 1px 6px rgba(255, 255, 255, .7);
        }
        html.phc-night .services-group h2.service-group-name { text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
        .service-group-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 8px; background: var(--glass); margin-right: 8px; }
        .service-group-icon div { background: var(--ink) !important; width: 16px !important; height: 16px !important; }
        ul.services-list { gap: 12px !important; }
        li.service { margin: 0 !important; }

        /* ---------- Tiles ---------- */
        .service-card {
          position: relative; min-height: 68px; margin: 0 !important; padding: 12px !important;
          display: flex; align-items: center;
          background: var(--glass) !important; border: 1px solid var(--glass-edge) !important; border-radius: 16px !important;
          -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
          box-shadow: var(--shadow) !important;
          transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease !important;
        }
        .service-card:hover { transform: translateY(-2px); background: var(--glass-hover) !important; box-shadow: var(--shadow-lift) !important; }
        .service-card:has(a:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
        .service-card a:focus-visible { outline: none; }
        .service-title { display: flex !important; align-items: center; gap: 12px; width: 100%; padding: 0 !important; }
        a.service-icon {
          flex: none; display: flex !important; align-items: center; justify-content: center;
          width: 44px !important; height: 44px !important; margin: 0 !important; padding: 8px !important;
          background: #ffffff; border-radius: 12px; box-shadow: 0 1px 3px rgba(40, 44, 80, .14);
        }
        a.service-icon img { width: 28px !important; height: 28px !important; object-fit: contain; }
        a.service-icon > div { width: 26px !important; height: 26px !important; }
        li.service[data-name="OKNote"] a.service-icon > div { background: #e7a53c !important; }
        li.service[data-name="NAS admin"] a.service-icon > div { background: #2f9e8f !important; }
        a.service-title-text { padding: 0 24px 0 0 !important; min-width: 0; }
        .service-card .service-name { color: var(--ink) !important; font-size: 15px !important; line-height: 20px !important; font-weight: 800 !important; }
        .service-card p.service-description, .service-card .service-description { color: var(--ink-soft) !important; font-size: 13px !important; line-height: 18px !important; font-weight: 600 !important; margin-top: 2px; }
        /* Status dot sits in the top-right corner of every tile */
        .service-card .site-monitor-status { position: absolute !important; top: 10px; right: 10px; margin: 0 !important; padding: 0 !important; }
        .site-monitor-status > div, .site-monitor-status span { width: 8px !important; height: 8px !important; }
        .site-monitor-status .bg-emerald-500 { background: var(--ok) !important; box-shadow: 0 0 0 3px rgba(76, 176, 122, .22); }
        .site-monitor-status .bg-rose-500, .site-monitor-status [class*=bg-red], .site-monitor-status [class*=bg-rose] { background: var(--down) !important; box-shadow: 0 0 0 3px rgba(224, 107, 107, .22); }

        @media (max-width: 640px) {
          #information-widgets { margin: 8px 8px 8px !important; }
          #services { padding: 0 2px !important; }
          .information-widget-greeting { flex-basis: 100%; }
          .information-widget-greeting span { font-size: 22px !important; line-height: 28px !important; }
        }

        /* ---------- Scene motion: slow and gentle ---------- */
        .phc-cloud { animation: phc-drift linear infinite; transition: opacity 3s ease; }
        @keyframes phc-drift { from { transform: translateX(-360px); } to { transform: translateX(1960px); } }
        .phc-deck { transition: opacity 3s ease; animation: phc-deck 90s ease-in-out infinite alternate; }
        @keyframes phc-deck { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
        .phc-tree { transform-box: fill-box; transform-origin: 50% 100%; animation: phc-sway 7s ease-in-out infinite; }
        @keyframes phc-sway { 0%, 100% { transform: rotate(calc(var(--sway, 1.4deg) * -1)); } 50% { transform: rotate(var(--sway, 1.4deg)); } }
        .phc-halo { transform-box: fill-box; transform-origin: center; animation: phc-breathe 8s ease-in-out infinite; }
        @keyframes phc-breathe { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.12); opacity: 1; } }
        .phc-rays { animation: phc-spin 160s linear infinite; transition: opacity 3s ease; }
        @keyframes phc-spin { to { transform: rotate(360deg); } }
        .phc-sun, .phc-moon, .phc-stars, .phc-warmth { transition: opacity 3s ease; }
        .phc-stars circle { animation: phc-twinkle 6s ease-in-out infinite; }
        @keyframes phc-twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
        .phc-mist { animation: phc-mist 40s ease-in-out infinite alternate; }
        @keyframes phc-mist { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
        .phc-ripple { animation: phc-ripple 5s ease-in-out infinite; }
        @keyframes phc-ripple { 0%, 100% { opacity: .2; } 50% { opacity: .7; } }
        .phc-birds { animation: phc-birds 70s linear infinite; }
        @keyframes phc-birds { from { transform: translate(-120px, 230px); } 50% { transform: translate(800px, 180px); } to { transform: translate(1760px, 220px); } }
        .phc-cap { opacity: var(--capop, 1); }
        .phc-snowcover { opacity: var(--snowcover, 0); transition: opacity 4s ease; }

        /* Rain, drizzle and storms */
        .phc-rain { display: none; }
        #phc-scene.phc-raining .phc-rain { display: block; }
        .phc-rain line { animation: phc-rain linear infinite; }
        #phc-scene.phc-drizzle .phc-rain line:nth-child(2n) { display: none; }
        #phc-scene:not(.phc-heavy) .phc-rain line:nth-child(3n) { display: none; }
        @keyframes phc-rain { from { transform: translate(0, -60px); } to { transform: translate(var(--drift, -40px), 960px); } }
        .phc-flash { opacity: 0; }
        #phc-scene.phc-thunder .phc-flash { animation: phc-flash 11s linear infinite; }
        @keyframes phc-flash { 0%, 91%, 93.5%, 100% { opacity: 0; } 91.6% { opacity: .55; } 92.2% { opacity: .08; } 92.8% { opacity: .4; } }
        .phc-fog { opacity: 0; transition: opacity 4s ease; animation: phc-mist 50s ease-in-out infinite alternate; }
        #phc-scene.phc-foggy .phc-fog { opacity: 1; }

        /* Snow, spring petals and autumn leaves share one set of falling shapes */
        .phc-flakes { display: none; }
        .phc-flakes ellipse { animation: phc-fall linear infinite; opacity: .9; }
        @keyframes phc-fall { 0% { transform: translate(0, -20px) rotate(0); } 50% { transform: translate(28px, 450px) rotate(180deg); } 100% { transform: translate(-12px, 920px) rotate(360deg); } }
        #phc-scene.phc-snowing .phc-flakes, #phc-scene.phc-petals .phc-flakes, #phc-scene.phc-leaves .phc-flakes { display: block; }
        #phc-scene.phc-petals .phc-flakes g:nth-child(2n), #phc-scene.phc-leaves .phc-flakes g:nth-child(2n) { display: none; }
        #phc-scene.phc-petals .phc-flakes ellipse, #phc-scene.phc-leaves .phc-flakes ellipse { opacity: .8; }
        #phc-scene:not(.phc-blossom) .phc-dot { display: none; }

        /* Summer-night fireflies */
        .phc-flies { display: none; }
        #phc-scene.phc-fireflies .phc-flies { display: block; }
        .phc-flies circle { animation: phc-fly ease-in-out infinite; filter: drop-shadow(0 0 4px #fff3a0); }
        @keyframes phc-fly { 0%, 100% { transform: translate(0, 0); opacity: 0; } 25% { opacity: 1; } 50% { transform: translate(30px, -24px); opacity: .3; } 75% { transform: translate(-16px, -10px); opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
          #phc-scene * { animation: none !important; }
          .phc-rain, .phc-flakes, .phc-flies, .phc-flash { display: none !important; }
        }
        PHC_EOF
        cat > /app/config/custom.js <<'PHC_EOF'
        /* Patel Home Cloud: a calm, cartoon nature scene behind the dashboard.
           - Season: colors blend day by day through spring, summer, autumn and winter.
           - Time: sun and moon follow the real sunrise and sunset, with golden hour and stars.
           - Weather: live from Open-Meteo (free, no key) every 15 minutes: clear, clouds,
             fog, drizzle, rain, thunder or snow, with wind moving clouds, rain and trees.
           - Also adds a small weather chip to the top bar.
           Only the browser talks to Open-Meteo; no key or account is involved. */
        (function () {
          if (document.getElementById("phc-scene")) return;

          /* Weather location (rounded to the town). */
          var LAT = 0.00, LON = 0.00; /* set to your own town, two decimals is enough */

          var NS = "http://www.w3.org/2000/svg";
          var W = 1600, H = 900;

          var P = {
            spring: { skyTop: "#9fd2f0", skyMid: "#cfe8f6", skyBot: "#fdeef2", sun: "#fff1b8", cloud: "#ffffff", cloudShade: "#d9e4f2", far: "#c4c6ea", farShade: "#a9acd8", mid: "#9db5d9", midShade: "#8199c4", cap: "#ffffff", mesa: "#efc3a1", mesaShade: "#d6a07f", hill1: "#c9eab8", hill1b: "#a9d99c", hill2: "#a6dc98", hill2b: "#86c682", hill3: "#8fd08c", hill3b: "#6cb977", treeD: "#ef9fb8", treeL: "#ffd3e0", pineD: "#4f9a6c", pineL: "#7fc493", trunk: "#9b7a5f", accent: "#ffffff", water: "#a9daf0", particle: "#ffc4d6" },
            summer: { skyTop: "#7cc4ef", skyMid: "#bfe3f7", skyBot: "#fff4d8", sun: "#ffe08a", cloud: "#ffffff", cloudShade: "#d3e2f1", far: "#b2c0e6", farShade: "#95a6d6", mid: "#86a7d3", midShade: "#6c8dc0", cap: "#f4f7fb", mesa: "#f0b484", mesaShade: "#d49466", hill1: "#bfe49c", hill1b: "#9cd283", hill2: "#97d184", hill2b: "#76bd6d", hill3: "#7cc375", hill3b: "#5aa85f", treeD: "#5fae6c", treeL: "#9ad696", pineD: "#3f8d58", pineL: "#6cb87a", trunk: "#8f6d52", accent: "#fff1a8", water: "#93d1ee", particle: "#fff3a0" },
            autumn: { skyTop: "#94c2e6", skyMid: "#d3e1ee", skyBot: "#fbe2c8", sun: "#ffc98f", cloud: "#fff8f0", cloudShade: "#ead6cc", far: "#d3c1dc", farShade: "#b9a5c8", mid: "#b6a2c8", midShade: "#9a86b1", cap: "#fbf7f2", mesa: "#e8a77d", mesaShade: "#c9875e", hill1: "#f4d49a", hill1b: "#eabc7f", hill2: "#ecbb80", hill2b: "#dc9e66", hill3: "#e0a374", hill3b: "#c9865b", treeD: "#e5864f", treeL: "#f8c06a", pineD: "#4f8f70", pineL: "#79b394", trunk: "#8a6650", accent: "#f7c56b", water: "#c2d7e6", particle: "#e98a4a" },
            winter: { skyTop: "#bcd3f0", skyMid: "#dbe6f6", skyBot: "#f6eef8", sun: "#fff2d6", cloud: "#ffffff", cloudShade: "#dbe2ee", far: "#c6d0e6", farShade: "#a9b6d4", mid: "#a9bcda", midShade: "#8ea3c6", cap: "#ffffff", mesa: "#e8dfdb", mesaShade: "#cbbfba", hill1: "#f1f4fb", hill1b: "#dfe6f4", hill2: "#e6ebf6", hill2b: "#d0daee", hill3: "#d9e1f1", hill3b: "#c0cde6", treeD: "#aebbd0", treeL: "#eef2f8", pineD: "#4f8780", pineL: "#86b8b0", trunk: "#8d7a6c", accent: "#ffffff", water: "#cfe0ee", particle: "#ffffff" }
          };
          var NIGHT = { skyTop: "#1f2547", skyMid: "#3a3a68", skyBot: "#6b5c8c" };
          var STORM = { skyTop: "#8e9bb0", skyMid: "#aab4c4", skyBot: "#c7ccd6" };
          var GOLD = { skyMid: "#ffcfa8", skyBot: "#ffb98c" };

          /* ---------- color helpers ---------- */
          function hex(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }
          function toHsl(c) {
            var r = hex(c), R = r[0] / 255, G = r[1] / 255, B = r[2] / 255;
            var mx = Math.max(R, G, B), mn = Math.min(R, G, B), l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
            if (d) {
              sat = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
              h = mx === R ? (G - B) / d + (G < B ? 6 : 0) : mx === G ? (B - R) / d + 2 : (R - G) / d + 4;
              h *= 60;
            }
            return [h, sat, l];
          }
          function fromHsl(h, sat, l) {
            function f(n) { var k = (n + h / 30) % 12, a = sat * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); }
            var o = "#";
            [f(0), f(8), f(4)].forEach(function (v) { var x = Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16); o += x.length < 2 ? "0" + x : x; });
            return o;
          }
          function mixRgb(a, b, t) {
            var x = hex(a), y = hex(b), o = "#";
            for (var i = 0; i < 3; i++) { var v = Math.round(x[i] + (y[i] - x[i]) * t).toString(16); o += v.length < 2 ? "0" + v : v; }
            return o;
          }
          /* RGB hue, but keep the pastel saturation so in-between seasons don't go grey. */
          function mix(a, b, t, keep) {
