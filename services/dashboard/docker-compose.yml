          [[0, 0], [26, 10], [50, -4]].forEach(function (b) {
            el("path", { d: "M" + b[0] + " " + b[1] + " q7 -7 14 0 q7 -7 14 0", fill: "none", stroke: "#5b4d63", "stroke-width": "2.5", "stroke-linecap": "round", opacity: ".5" }, birds);
