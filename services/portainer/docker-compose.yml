# Portainer CE: web UI for every Docker container on the NAS
# Project folder on the NAS: Shared folder/docker/portainer

services:
  portainer:
    container_name: Portainer
    image: portainer/portainer-ce:latest
    ports:
      - '9000:9000'   # Web UI (HTTP)
      - '8000:8000'   # Edge agent tunnel (only needed for remote agents)
    volumes:
      - /volume1/docker/portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
